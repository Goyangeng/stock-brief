spring:
  application:
    name: stock-brief

  datasource:
    url: jdbc:postgresql://localhost:5432/stockbrief
    username: stockbrief
    password: stockbrief

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

finnhub:
  api-key: ${FINNHUB_API_KEY:}
  base-url: https://finnhub.io/api/v1
